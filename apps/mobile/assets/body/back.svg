<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 470" fill="none">
  <!-- HEAD (posterior) -->
  <ellipse id="head" cx="100" cy="34" rx="28" ry="32" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- NECK (posterior) -->
  <rect id="neck" x="88" y="64" width="24" height="22" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- SHOULDERS (posterior) -->
  <ellipse id="shoulder.left"  cx="63"  cy="93" rx="22" ry="15" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <ellipse id="shoulder.right" cx="137" cy="93" rx="22" ry="15" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- UPPER BACK — rendered before scapulae so blades sit on top -->
  <rect id="upper-back" x="74" y="88" width="52" height="57" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- SCAPULAE (shoulder blades) — rendered after upper-back to be topmost -->
  <path id="scapula.left"  d="M76 94 L91 94 L91 130 Q84 138 76 130 Z" fill="#e0e0e0" stroke="#888" stroke-width="1.5"/>
  <path id="scapula.right" d="M109 94 L124 94 L124 130 Q116 138 109 130 Z" fill="#e0e0e0" stroke="#888" stroke-width="1.5"/>

  <!-- MID BACK -->
  <rect id="mid-back" x="78" y="145" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- LOWER BACK -->
  <rect id="lower-back" x="78" y="175" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- UPPER ARMS (posterior) -->
  <rect id="upper-arm.left"  x="43" y="100" width="20" height="60" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <rect id="upper-arm.right" x="137" y="100" width="20" height="60" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- ELBOWS (posterior — olecranon) -->
  <ellipse id="elbow.left"  cx="53"  cy="160" rx="11" ry="9" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <ellipse id="elbow.right" cx="147" cy="160" rx="11" ry="9" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- FOREARMS (posterior) -->
  <rect id="forearm.left"  x="44" y="169" width="18" height="54" rx="9" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <rect id="forearm.right" x="138" y="169" width="18" height="54" rx="9" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- WRISTS (posterior) -->
  <ellipse id="wrist.left"  cx="53"  cy="223" rx="10" ry="7" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <ellipse id="wrist.right" cx="147" cy="223" rx="10" ry="7" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- HANDS (posterior / dorsum) -->
  <ellipse id="hand.left"  cx="53"  cy="248" rx="13" ry="22" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <ellipse id="hand.right" cx="147" cy="248" rx="13" ry="22" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- HIPS (posterior) -->
  <rect id="hip.left"  x="78"  y="205" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <rect id="hip.right" x="100" y="205" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- GLUTES -->
  <path id="glute.left"  d="M74 227 Q74 270 100 270 L100 227 Z" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <path id="glute.right" d="M100 227 L100 270 Q126 270 126 227 Z" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- HAMSTRINGS -->
  <rect id="hamstring.left"  x="74"  y="270" width="22" height="48" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <rect id="hamstring.right" x="104" y="270" width="22" height="48" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- KNEES (posterior — popliteal) -->
  <ellipse id="knee.left"  cx="85"  cy="319" rx="13" ry="12" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <ellipse id="knee.right" cx="115" cy="319" rx="13" ry="12" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- CALVES -->
  <rect id="calf.left"  x="74"  y="331" width="22" height="60" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <rect id="calf.right" x="104" y="331" width="22" height="60" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- ANKLES (posterior) -->
  <ellipse id="ankle.left"  cx="85"  cy="392" rx="11" ry="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <ellipse id="ankle.right" cx="115" cy="392" rx="11" ry="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- HEELS -->
  <ellipse id="heel.left"  cx="80"  cy="418" rx="14" ry="12" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <ellipse id="heel.right" cx="120" cy="418" rx="14" ry="12" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>

  <!-- FEET (posterior / plantar) -->
  <ellipse id="foot.left"  cx="80"  cy="445" rx="18" ry="13" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <ellipse id="foot.right" cx="120" cy="445" rx="18" ry="13" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
</svg>
